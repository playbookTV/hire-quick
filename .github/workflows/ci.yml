name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hirequick_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    env:
      # CI uses the local Postgres service (real connections → concurrency tests run here).
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/hirequick_test
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/hirequick_test
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.27.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @hq/database exec prisma generate
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm --filter @hq/database exec prisma db push --skip-generate
      - run: pnpm test
